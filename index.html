display:flex;justify-content:space-between;gap:12px;align-items:center}.quest strong{color:#e9c985}.market{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.market article{background:#101c21;border:1px solid #b79b5940;padding:14px;border-radius:12px;text-align:center}.market article span{font-size:42px;display:block}.market button{width:100%;margin-top:8px}.worldheading{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.rankline{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:15px;border-bottom:1px solid #ffffff15}.rankline b{color:#e7c680;font-size:24px}.hero .stats{max-width:750px;margin:auto}.hero .bar{max-width:750px;margin:12px auto}.tv nav,.tv header{display:none}.tv main{max-width:none}.tv .hero{min-height:65vh}.tv .dragon{height:40vh}.tvexit{position:fixed;right:12px;top:12px;z-index:20}@media(max-width:600px){nav{overflow:auto;flex-wrap:nowrap}nav button{flex:none}.hero{min-height:390px}.hero .dragon{height:200px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.player{padding:10px}.player h3{overflow-wrap:anywhere}.sprite{height:115px}.sprite svg{height:110px}.panel input{max-width:100%}.stat{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

</style><header><div><small>⚔ CAMPANHA COMERCIAL</small><h1>SALES QUEST</h1></div><button onclick="adminLogin()">⚙ Administração</button></header><main><nav id="nav"></nav><div id="app"></div></main><div id="toast"></div><script>
const classes=['⚔️ Guerreiro','🧙 Mago','🏹 Arqueiro','🛡️ Guardião'];const items=[['Espada de bronze','🗡️',50],['Escudo real','🛡️',100],['Mascote dragão','🐉',150],['Coroa lendária','👑',250],['Asas mágicas','🪽',350],['Armadura de cristal','💎',400],['Cajado lunar','🌙',200],['Fênix dourada','🔥',500],['Capa do reino','🧥',180],['Elmo ancestral','⚜️',300],['Raposa espiritual','🦊',220],['Espada celestial','⚔️',600]];let s;try{s=JSON.parse(localStorage.getItem('salesquest-v1'))}catch{};s=s||{goal:170,title:'Dragão das Metas',reward:'Prêmio coletivo definido pelo gestor',players:[],log:[],pin:'1234',next:1};if(!s.v4){s.goal=170;s.v4=true;}let tab='world',admin=false,selected=null;const $=x=>document.getElementById(x);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const total=()=>s.players.reduce((a,p)=>a+p.sales,0);const level=n=>Math.max(1,n);function save(){localStorage.setItem('salesquest-v1',JSON.stringify(s));render()}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}function go(t){tab=t;render()}function adminLogin(){if(admin){admin=false;go('world');return}if(prompt('PIN administrativo (inicial: 1234)')===s.pin){admin=true;go('admin')}else toast('PIN incorreto')}
function render(){let n=total(),left=Math.max(0,s.goal-n);$('nav').innerHTML=[['world','⚔ Batalha'],['map','🗺 Reino'],['arena','⚔ Treinamento'],['quests','📜 Missões'],['rank','🏆 Ranking'],['shop','🎒 Meu herói'],['rewards','🎁 Prêmios'],...(admin?[['admin','⚙ Gestão']]:[])].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');let a='';if(tab==='world'){a=`<section class="panel hero"><div class="mount">${landscape()}</div><small>MISSÃO COLETIVA</small><h2>${esc(s.title)}</h2><div id="dragon" class="dragon">${left?dragon(): '<span style="font-size:110px">🏆</span>'}</div><strong>${left?left+' / '+s.goal+' HP':'CHEFÃO DERROTADO!'}</strong><div class="bar"><i style="width:${left/s.goal*100}%"></i></div><div class="stats"><div class="stat">Meta<strong>${s.goal}</strong></div><div class="stat">Vendas<strong>${n}</strong></div><div class="stat">Restantes<strong>${left}</strong></div></div></section>${journey()}<div class="worldheading"><h2>Guilda dos aventureiros</h2><button onclick="tv()">Modo TV</button></div><div class="cards">${[...s.players].sort((a,b)=>b.sales-a.sales).map(card).join('')||'<p>Nenhum aventureiro. Cadastre vendedores na administração.</p>'}</div>`}if(tab==='map'){a=journey()+atlas()}if(tab==='arena'){a=arena()+exploration()}if(tab==='quests'){a=questView()}if(tab==='rank'){a='<section class="panel"><h2>Salão da fama</h2>'+[...s.players].sort((a,b)=>b.sales-a.sales).map((p,i)=>`<div class="rankline"><b>${i+1}º</b><div><strong>${esc(p.name)}</strong><small> · Nível ${level(p.sales)}</small><div class="bar"><i style="width:${p.sales/Math.max(1,...s.players.map(q=>q.sales))*100}%"></i></div></div><strong>${p.sales} vendas</strong></div>`).join('')+'</section>'}if(tab==='shop'){let p=s.players.find(p=>p.id===selected);a=`<section class="panel"><h2>Meu aventureiro</h2><select onchange="selected=Number(this.value);render()"><option value="">Escolha seu personagem</option>${s.players.map(q=>`<option value="${q.id}" ${q.id===selected?'selected':''}>${esc(q.name)}</option>`).join('')}</select>${p?card(p)+`<label>Classe <select onchange="changeClass(${p.id},this.value)">${classes.map(c=>`<option ${c===p.cls?'selected':''}>${c}</option>`).join('')}</select></label><h3>Mercado da guilda</h3><div class="market">${items.map((it,i)=>`<article><span>${it[1]}</span>${it[0]}<br><small>${it[2]} moedas</small><button ${p.owned.includes(i)||p.coins<it[2]?'disabled':''} onclick="buy(${p.id},${i})">${p.owned.includes(i)?'Adquirido':'Comprar'}</button></article>`).join('')}</div>`:''}</section>`}if(tab==='rewards'){a=`<section class="panel"><h2>Recompensas da campanha</h2><h3>${left?'🔒':'🏆'} ${esc(s.reward)}</h3><p>${left?`Faltam ${left} vendas para desbloquear.`:'Meta coletiva conquistada!'}</p><h3>Conquistas individuais</h3>${s.players.map(p=>`<p>${esc(p.name)}: ${p.sales>=1?'🥉 Primeira venda':''} ${p.sales>=5?'🥈 Cinco vendas':''} ${p.sales>=10?'🥇 Dez vendas':''}</p>`).join('')}</section>`}if(tab==='admin'&&admin){a=`<section class="panel"><h2>Configurar campanha</h2><label>Nome do chefão <input id="boss" value="${esc(s.title)}"></label><label>Meta total <input id="goal" type="number" min="1" value="${s.goal}"></label><label>Prêmio coletivo <input id="reward" value="${esc(s.reward)}"></label><button class="gold" onclick="config()">Salvar campanha</button></section><section class="panel"><h2>Adicionar vendedor</h2><div class="row"><input id="name" placeholder="Nome do vendedor" maxlength="60"><button class="gold" onclick="add()">Cadastrar</button><button onclick="bulk()">Cadastrar equipe</button></div>${s.players.map(p=>`<p>${esc(p.name)} · ${p.sales} vendas</p><div class="row"><button class="gold" onclick="sale(${p.id},1)">+1 venda</button><button onclick="sale(${p.id},-1)" ${p.sales?'':'disabled'}>Corrigir −1</button><button onclick="removePlayer(${p.id})">Remover</button></div>`).join('')}</section><section class="panel"><h2>Histórico</h2>${s.log.slice(0,30).map(x=>`<p>${esc(x)}</p>`).join('')}<button onclick="changePin()">Alterar PIN</button> <button onclick="exportData()">Exportar dados</button></section>`}$('app').innerHTML=a;if(tab==='world')$('app').insertAdjacentHTML('beforeend',guildHall());if(tab==='rewards')$('app').insertAdjacentHTML('beforeend',rewardHall());if(tab==='admin'&&admin)$('app').insertAdjacentHTML('beforeend',rewardAdmin());}
function card(p){return `<article class="player"><div class="sprite">${avatar(p)}</div><h3>${esc(p.name)}</h3><small>${esc(p.cls)} · Nível ${level(p.sales)} · ${['Aprendiz','Veterano','Campeão','Lendário','Celestial'][Math.min(4,Math.floor(p.sales/35))]}</small><p>${p.sales} vendas · ${p.sales*100} XP · 🪙 ${p.coins}</p><div class="bar"><i style="width:${xpProgress(p.sales)}%"></i></div><small>${xpProgress(p.sales)}% até o próximo marco de 35 vendas</small></article>`}function config(){if(!admin)return;let g=Number($('goal').value);if(!Number.isSafeInteger(g)||g<1)return toast('Meta inválida');s.goal=g;s.title=$('boss').value.trim()||'Dragão das Metas';s.reward=$('reward').value.trim()||'Prêmio coletivo';save()}function add(){if(!admin)return;let name=$('name').value.trim();if(!name)return toast('Informe o nome');s.players.push({id:s.next++,name,cls:classes[s.players.length%4],sales:0,coins:0,owned:[]});save()}function sale(id,d){if(!admin)return;let p=s.players.find(x=>x.id===id);if(!p||p.sales+d<0)return;p.sales+=d;p.coins+=d*50;s.log.unshift(new Date().toLocaleString('pt-BR')+' · '+p.name+' · '+(d>0?'+1 venda':'Correção −1'));save();if(d>0){battleNotice(p); }toast(d>0?(milestones().includes(total())?'🏆 Marco coletivo desbloqueado!':p.sales%35===0?'✨ Nova evolução do herói!':'⚔ '+p.name+' subiu para o nível '+level(p.sales)):'Venda corrigida')}function removePlayer(id){if(admin&&confirm('Remover vendedor e suas vendas da campanha?')){s.players=s.players.filter(p=>p.id!==id);save()}}function changeClass(id,c){s.players.find(p=>p.id===id).cls=c;save()}function buy(id,i){let p=s.players.find(p=>p.id===id);if(p.coins<items[i][2]||p.owned.includes(i))return;p.coins-=items[i][2];p.owned.push(i);save();toast('Equipamento desbloqueado!')}function changePin(){if(!admin)return;let p=prompt('Novo PIN');if(p&&p.length>=4){s.pin=p;save()}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='sales-quest-backup.json';a.click();URL.revokeObjectURL(a.href)}
function bulk(){if(!admin)return;let names=prompt('Digite os nomes separados por vírgula');if(!names)return;for(let name of names.split(',').map(x=>x.trim().slice(0,60)).filter(Boolean)){s.players.push({id:s.next++,name,cls:classes[s.players.length%4],sales:0,coins:0,owned:[]})}save()}
function xpProgress(n){return (n%35)/35*100}
const milestones=()=>[35,70,105,140].filter(x=>x<s.goal).concat(s.goal);
const regions=['Floresta Esmeralda','Fortaleza de Gelo','Reino das Chamas','Templo Celestial','Coroa da Guilda'];
function journey(){let n=total();return `<section class="panel"><small>EXPEDIÇÃO REAL • TEMPORADA 01</small><h2>Trilha de conquistas</h2><div class="trail">${milestones().map((m,i)=>`<article class="${n>=m?'unlocked':''}"><span>${['🌲','🏔️','🔥','🏛️','👑'][i]||'🏆'}</span><b>${m} vendas</b><small>${regions[i]||'Vitória'}</small><small>${n>=m?'Desbloqueado':'Faltam '+(m-n)}</small></article>`).join('')}</div></section>`}
function arena(){return `<section class="panel"><h2>Campo de treinamento</h2><p>Explore a arena com seu herói. Treinar não altera vendas, moedas ou XP comercial.</p><div class="arena" id="arena" tabindex="0" aria-label="Arena de treinamento"><div class="dummy">🎯</div><div id="walker">${avatar(s.players.find(p=>p.id===selected)||s.players[0]||{cls:classes[0],sales:0,owned:[]})}</div></div><div class="controls"><button onclick="move(0,-8)">↑</button><button onclick="move(-8,0)">←</button><button onclick="move(0,8)">↓</button><button onclick="move(8,0)">→</button><button class="gold" onclick="strike()">Atacar</button></div><p id="practice">Treino livre</p></section>`}
let px=15,py=65,hits=0;function move(x,y){px=Math.max(2,Math.min(88,px+x));py=Math.max(5,Math.min(75,py+y));let w=$('walker');if(w){w.style.left=px+'%';w.style.top=py+'%'}}function strike(){let w=$('walker');if(!w)return;w.animate([{transform:'translateX(0)'},{transform:'translateX(22px) rotate(12deg)'},{transform:'translateX(0)'}],{duration:350});$('practice').textContent='Golpes de treino: '+(++hits)}document.addEventListener('keydown',e=>{if(tab!=='arena'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;let d={ArrowUp:[0,-8],ArrowDown:[0,8],ArrowLeft:[-8,0],ArrowRight:[8,0]}[e.key];if(d){e.preventDefault();move(...d)}else if(e.code==='Space'){e.preventDefault();strike()}});
function tv(){document.body.classList.toggle('tv');let b=$('tvexit');if(b)b.remove();else{b=document.createElement('button');b.id='tvexit';b.className='tvexit';b.textContent='Sair do modo TV';b.onclick=tv;document.body.append(b)}}
function mapView(n){let progress=n/s.goal*100;return `<section class="panel"><small>ATLAS DA CAMPANHA</small><h2>Os cinco territórios</h2><p>As regiões são liberadas pelo progresso coletivo.</p><div class="mapgrid">${[['Vila da Guilda','🏰',0],['Floresta Esmeralda','🌲',25],['Montanhas de Gelo','❄️',50],['Terras de Fogo','🌋',75],['Trono do Dragão','👑',100]].map(([name,icon,p])=>`<article class="region ${progress<p?'locked':''}"><span>${icon}</span><b>${name}</b><small>${progress>=p?'Exploração liberada':'Bloqueado · '+p+'% da meta'}</small></article>`).join('')}</div></section>`}
function questView(){return `<section class="panel"><h2>Quadro de missões</h2><p>Conquistas coletivas da temporada</p>${milestones().map((target,i)=>{return `<div class="quest"><div><strong>${['O primeiro passo','A guilda avança','Metade da jornada','Cerco final','A grande vitória'][i]}</strong><p>${Math.min(total(),target)} / ${target} vendas</p></div><span>${total()>=target?'✓ Concluída':'Em andamento'}</span></div>`}).join('')}</section><section class="panel"><h2>Missões dos aventureiros</h2>${s.players.map(p=>`<div class="quest"><strong>${esc(p.name)}</strong><span>${[1,5,10,20,40].filter(x=>p.sales>=x).length}/5 conquistas</span></div>`).join('')||'<p>Cadastre sua equipe para começar.</p>'}</section>`}
function landscape(){return `<svg viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#142334"/><stop offset="1" stop-color="#a17a61"/></linearGradient></defs><rect width="1200" height="500" fill="url(#sky)"/><circle cx="920" cy="100" r="55" fill="#f4d4a1" opacity=".7"/><path d="M0 320L160 100 300 270 480 65 650 290 810 130 1050 310 1200 140V500H0Z" fill="#344755"/><path d="M0 360L230 210 400 360 620 190 850 340 1050 230 1200 340V500H0Z" fill="#263c40"/><path d="M0 390Q300 330 600 410T1200 390V500H0Z" fill="#172b2a"/>${Array.from({length:22},(_,i)=>`<path d="M${i*58} 420l20 -70 20 70h-15v20h-10v-20z" fill="#132525"/>`).join('')}<g fill="#26323a" stroke="#a58d6b" stroke-width="2"><path d="M75 350V240h20v-25h20v25h20v110M145 350V280h70v70M225 350V220h20v-25h20v25h20v130"/><path d="M135 350V275h90v75"/></g></svg>`}
function dragon(){return `<svg viewBox="0 0 360 240"><g stroke="#231e29" stroke-width="4" stroke-linejoin="round"><path fill="#7e3844" d="M175 120L115 30 18 18 55 66 32 100 85 94 66 138 130 120 180 170M195 120L245 30 342 18 305 66 328 100 275 94 294 138 230 120 180 170"/><path fill="#ba6750" d="M175 145Q100 210 210 217L295 194 272 224 180 233 120 205 130 165Z"/><path fill="#a64e45" d="M145 170L132 115 150 80 210 80 230 115 215 170 195 198 160 198Z"/><path fill="#d78c60" d="M160 125L200 125 207 166 180 190 153 166Z"/><path fill="#c46a4e" d="M140 100L130 60 155 68 165 45 180 65 195 45 205 68 230 60 220 100 205 128 155 128Z"/><path fill="#f2d7a0" d="M140 75L118 35 160 62M220 75L242 35 200 62"/><path fill="#f8dc75" d="M147 86L170 92 155 99ZM213 86L190 92 205 99Z"/><path fill="#42262b" d="M160 111L200 111 180 121Z"/><path fill="#a64e45" d="M142 160L105 185 95 209 143 205 165 177M218 160L255 185 265 209 217 205 195 177"/></g></svg>`}
function avatar(p){let i=Math.max(0,classes.indexOf(p.cls)),c=['#688da9','#8968ad','#69966a','#b28c55'][i],gold=p.sales>=140?'#f7eaff':p.sales>=105?'#f39859':p.sales>=70?'#8de1f1':p.sales>=35?'#f4cc72':'#b9c2c5';return `<svg viewBox="0 0 96 112" shape-rendering="crispEdges"><ellipse cx="48" cy="104" rx="28" ry="5" fill="#0b1317" opacity=".6"/><path fill="${c}" d="M24 42H72V94H24Z"/><path fill="#26313c" d="M33 83H45V103H27V96H33M51 83H63V96H69V103H51"/><path fill="${gold}" d="M28 45H68V76H28Z"/><path fill="${c}" d="M36 49H60V72H36Z"/><path fill="#594338" d="M28 75H68V81H28Z"/><path fill="#f0bd90" d="M32 19H64V42H32Z"/><path fill="${i===1?c:gold}" d="M28 15H68V29H28ZM36 9H60V15H36Z"/><path fill="#26313c" d="M36 30H41V35H36ZM55 30H60V35H55Z"/><path fill="#f0bd90" d="M18 50H28V70H18ZM68 50H78V70H68Z"/>${i===1?'<path fill="#a27a50" d="M80 20H85V98H80Z"/><rect x="76" y="12" width="13" height="13" fill="#b5a2ff"/>':i===2?'<path d="M78 28Q100 57 78 86L78 28" stroke="#d2a56b" fill="none" stroke-width="4"/>':'<path fill="'+gold+'" d="M80 19H86V66H80Z"/><path fill="#ac7b40" d="M73 65H93V70H73ZM80 70H86V83H80Z"/>'}${p.owned.length?'<rect x="7" y="83" width="14" height="14" fill="#e8c777"/><rect x="10" y="86" width="8" height="8" fill="#8a6438"/>':''}</svg>`}

const realmData=[['Vila da Guilda',0,'#577c55','Ferreiro'],['Floresta Esmeralda',35,'#315e46','Guardião da floresta'],['Fortaleza de Gelo',70,'#7799ad','Sentinela do gelo'],['Reino das Chamas',105,'#9b5140','Mestre das chamas'],['Templo Celestial',140,'#7774a4','Oráculo'],['Coroa da Guilda',170,'#ad9257','Rei da guilda']];
let realmIndex=0,ex=12,ey=65,practiceWins=0,enemyHP=3;
function realmArt(i){let c=realmData[i][2];return `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice"><rect width="400" height="200" fill="${c}"/><circle cx="320" cy="36" r="24" fill="#f3d9a3" opacity=".8"/><path d="M0 100L80 20 150 110 240 15 400 110V200H0Z" fill="#253b43" opacity=".6"/><path d="M0 130Q100 95 200 130T400 120V200H0Z" fill="${c}"/><path d="M170 200L220 95 245 95 255 200Z" fill="#b4a28a" opacity=".8"/>${Array.from({length:12},(_,j)=>{let x=(j*71+13)%390,y=115+(j*17)%65;return i===0||i===2||i>=4?`<g transform="translate(${x} ${y})"><rect x="-12" y="-25" width="24" height="25" fill="#b5a58c"/><path d="M-17 -25L0 -43 17 -25Z" fill="#55464c"/><rect x="-4" y="-12" width="8" height="12" fill="#413d38"/></g>`:`<g transform="translate(${x} ${y})"><rect x="-3" y="-8" width="6" height="14" fill="#493b32"/><path d="M-13 -5L0 -43 13 -5Z" fill="#233f39"/></g>`}).join('')}</svg>`}
function atlas(){return `<section class="panel"><small>MAPA DO REINO</small><h2>Explore seis regiões</h2><div class="realm-grid">${realmData.map((r,i)=>`<article class="realm ${total()<r[1]?'locked':''}">${realmArt(i)}<h3>${r[0]}</h3><p>${total()>=r[1]?'Região liberada':'Faltam '+(r[1]-total())+' vendas'}</p><button ${total()<r[1]?'disabled':''} onclick="visit(${i})">Explorar</button></article>`).join('')}</div></section>`}
function visit(i){if(!realmData[i]||total()<realmData[i][1])return;realmIndex=i;ex=12;ey=65;enemyHP=3;go('arena')}
function exploration(){if(total()<realmData[realmIndex][1])realmIndex=0;let p=s.players.find(q=>q.id===selected)||s.players[0]||{cls:classes[0],sales:0,owned:[]};return `<section class="panel"><small>EXPLORAÇÃO LIVRE</small><h2>${realmData[realmIndex][0]}</h2><select onchange="visit(Number(this.value))">${realmData.map((r,i)=>`<option value="${i}" ${i===realmIndex?'selected':''} ${total()<r[1]?'disabled':''}>${r[0]}</option>`).join('')}</select><p>Toque no cenário para caminhar. Aproxime-se dos personagens para interagir.</p><div class="explorefield" onclick="walkTo(event)">${realmArt(realmIndex)}<button class="npc" style="left:72%;top:50%" onclick="event.stopPropagation();talk()">✦ ${realmData[realmIndex][3]}</button><button class="npc" style="left:45%;top:75%" onclick="event.stopPropagation();fight()">⚔ Monstro de treino</button><div id="explorer" class="explorer" style="left:${ex}%;top:${ey}%">${avatar(p)}</div></div><div class="controls"><button onclick="exploreMove(0,-8)">↑</button><button onclick="exploreMove(-8,0)">←</button><button onclick="exploreMove(0,8)">↓</button><button onclick="exploreMove(8,0)">→</button><button onclick="fight()">Atacar</button><button onclick="talk()">Conversar</button></div><p id="exploremsg">Vitórias de treino nesta sessão: ${practiceWins}. Sem impacto nas vendas.</p></section>`}
function exploreMove(dx,dy){ex=Math.max(0,Math.min(84,ex+dx));ey=Math.max(0,Math.min(78,ey+dy));let e=$('explorer');if(e){e.style.left=ex+'%';e.style.top=ey+'%'}}
function walkTo(e){let r=e.currentTarget.getBoundingClientRect();ex=(e.clientX-r.left)/r.width*100-6;ey=(e.clientY-r.top)/r.height*100-10;exploreMove(0,0)}
function talk(){let m=$('exploremsg');if(m)m.textContent=Math.hypot(ex+6-72,ey+10-50)>22?'Aproxime-se do personagem.':realmData[realmIndex][3]+': A guilda precisa de você! Próximo objetivo: '+(milestones().find(x=>x>total())||s.goal)+' vendas.'}
function fight(){let m=$('exploremsg');if(!m)return;if(Math.hypot(ex+6-45,ey+10-75)>22){m.textContent='Aproxime-se do monstro para atacar.';return}let e=$('explorer');if(e&&e.animate)e.animate([{transform:'translateX(0)'},{transform:'translateX(15px)'},{transform:'translateX(0)'}],{duration:250});enemyHP--;if(enemyHP<=0){practiceWins++;enemyHP=3;m.textContent='Vitória! Total de treinos vencidos: '+practiceWins}else m.textContent='Golpe certeiro! Vida do monstro: '+enemyHP+'/3'}
function battleNotice(p){let b=document.createElement('div');b.className='battleflash';b.innerHTML=avatar(p)+'<strong>−1 HP</strong><h2>'+esc(p.name)+'</h2><small>Venda confirmada · Nível '+level(p.sales)+'</small>';document.body.append(b);setTimeout(()=>b.remove(),1850)}
function guildHall(){let leaders=[...s.players].sort((a,b)=>b.sales-a.sales);return `<section class="panel"><small>CRÔNICAS DA GUILDA</small><h2>${total()>=s.goal?'A vitória é nossa!':'A próxima batalha'}</h2><p>${leaders.length&&leaders[0].sales>0?'Liderança: '+leaders.filter(p=>p.sales===leaders[0].sales).map(p=>esc(p.name)).join(', '):'Aguardando a primeira venda.'}</p><p>${total()>=s.goal?'Campanha concluída.':'Próximo marco: '+(milestones().find(x=>x>total())||s.goal)+' vendas'}</p><button onclick="go('map')">Explorar o reino</button></section>`}
function rewardHall(){return `<section class="panel"><h2>Baús da campanha</h2>${milestones().map(n=>`<div class="rewardrow"><span>${total()>=n?'🏆':'🔒'}</span><strong>${n} vendas · ${esc((s.rewards||{})[n]||'Recompensa a definir')}</strong><small>${total()>=n?'Liberado':'Bloqueado'}</small></div>`).join('')}</section>`}
function rewardAdmin(){return `<section class="panel"><h2>Prêmios por marco</h2>${milestones().map(n=>`<div class="rewardrow"><label>${n} vendas <input id="reward${n}" maxlength="120" value="${esc((s.rewards||{})[n]||'')}"></label></div>`).join('')}<button class="gold" onclick="saveRewards()">Salvar premiações</button></section>`}
function saveRewards(){if(!admin)return;s.rewards={};for(let n of milestones())s.rewards[n]=$('reward'+n).value.trim();save();toast('Premiações atualizadas')}

render();</script></html>
